[build]
  command = "npm run build"
  publish = ".next"
  # Pas de déploiement (15 crédits) si seuls des .md changent
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)*.md'"

[build.environment]
  NODE_VERSION = "22"
  NPM_VERSION = "10"

# Plugin Next.js officiel
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Configuration du serveur de développement
[dev]
  port = 3001

# Headers de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"